<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffc00">
  <title>Snap Login Demo</title>
  <style>
    :root { color-scheme: light; --yellow:#fffc00; --ink:#111; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
      background:var(--yellow); color:var(--ink);
      font-family:Arial, Helvetica, sans-serif;
    }
    .card {
      width:min(100%, 390px); background:#fff; border:2px solid #111;
      border-radius:28px; padding:34px 26px; text-align:center;
      box-shadow:8px 8px 0 #111;
    }
    .ghost {
      width:84px;height:84px;margin:0 auto 18px;display:grid;place-items:center;
      border:3px solid #111;border-radius:25px;background:var(--yellow);
      font-size:48px;
    }
    h1 { margin:0 0 8px; font-size:28px; letter-spacing:-.8px; }
    p { line-height:1.5; color:#444; margin:0 0 24px; }
    .login {
      display:block;width:100%;padding:15px 18px;border:2px solid #111;
      border-radius:999px;background:#111;color:#fff;font-size:16px;
      font-weight:700;text-decoration:none;cursor:pointer;
    }
    .login:hover { transform:translateY(-1px); }
    .fine { margin-top:18px;font-size:12px;color:#666; }
    .status { display:none; margin:0 0 18px;padding:12px;border-radius:12px;background:#f1f1f1;font-size:14px; }
    .status.show { display:block; }
    .user { display:none; margin:18px 0 0; }
    .user.show { display:block; }
    .logout { margin-top:12px;border:0;background:transparent;text-decoration:underline;cursor:pointer; }
  </style>
</head>
<body>
  <main class="card">
    <div class="ghost" aria-hidden="true">👻</div>
    <h1>Snap Login Demo</h1>
    <p>Connect using Snapchat's official authorization flow.</p>
    <div id="status" class="status" role="status"></div>
    <a class="login" href="/auth/snapchat">Continue with Snapchat</a>
    <div id="user" class="user">
      <strong id="displayName"></strong>
      <form action="/auth/logout" method="post"><button class="logout" type="submit">Log out</button></form>
    </div>
    <div class="fine">Demo app · We never ask for or store your Snapchat password.</div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const status = document.getElementById("status");
    if (params.get("login") === "success") {
      status.textContent = params.get("log") === "failed"
        ? "Congratulations! Check your Snap Score! (Login succeeded, but the event could not be saved.)"
        : "Congratulations! Check your Snap Score!";
      status.classList.add("show");
    } else if (params.get("login") === "failed") {
      status.textContent = "Snapchat login was not completed. Please try again.";
      status.classList.add("show");
    }
    fetch("/api/session").then(r => r.json()).then(data => {
      if (data.authenticated) {
        document.getElementById("user").classList.add("show");
        document.getElementById("displayName").textContent =
          data.user.displayName ? "Signed in as " + data.user.displayName : "You are signed in";
      }
    }).catch(() => {});
  </script>
</body>
</html>
